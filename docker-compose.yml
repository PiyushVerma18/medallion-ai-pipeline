services:
  postgres:
    image: postgres:16-alpine
    container_name: medallion_postgres
    restart: always
    environment:
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: pipeline_password
      POSTGRES_DB: ticket_warehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_user -d ticket_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: